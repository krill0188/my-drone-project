repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-logger
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--strict, --ignore-missing-imports]

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck
        language: system
        types: [c, cpp]
        args: [--enable=all, --inconclusive, --std=c++20, --platform=stm32, --suppress=unreadVariable, --suppress=unusedFunction, --suppress=missingIncludeSystem, --suppress=configurationNotChecked]
        pass_filenames: true

  - repo: https://github.com/llvm/llvm-project
    rev: llvmorg-17.0.6
    hooks:
      - id: clang-format
        args: [--style=file]
        files: \.(cpp|hpp|c|h)$

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        types: [c, cpp]
        args: [-config-file=.clang-tidy, -p=build]
        pass_filenames: true
        always_run: false